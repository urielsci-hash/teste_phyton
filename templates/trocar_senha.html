<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trocar senha — Painel Sinergia Agro</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="pagina-login">
<form class="cartao-login" method="post" action="{{ url_for('trocar_senha') }}">
  <img src="{{ url_for('static', filename='img/logo.png') }}" alt="Sinergia Agro" class="logo-login">
  <h1>Defina uma nova senha</h1>
  <p style="font-size:12px;color:#777;margin:0;">{% if obrigatorio %}Este é o seu primeiro acesso — antes de continuar, crie uma senha só sua.{% else %}Altere sua senha de acesso ao painel.{% endif %}</p>
  <br>
  {% if erro %}<p class="mensagem-erro">{{ erro }}</p>{% endif %}
  <label for="nova_senha">Nova senha</label>
  <input type="password" id="nova_senha" name="nova_senha" required autofocus>
  <label for="confirmar_senha">Confirme a nova senha</label>
  <input type="password" id="confirmar_senha" name="confirmar_senha" required>
  <button type="submit">Salvar senha e entrar</button>
  {% if not obrigatorio %}
  <div style="text-align:center;margin-top:16px;">
    <a href="{{ url_for('admin_index') }}" style="color:#666;font-size:0.9rem;text-decoration:none;">Cancelar e voltar</a>
  </div>
  {% endif %}
</form>
</body>
</html>
