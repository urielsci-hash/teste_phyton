<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entrar — Painel Sinergia Agro</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="pagina-login">
<form class="cartao-login" method="post" action="{{ url_for('login') }}">
  <img src="{{ url_for('static', filename='img/logo.png') }}" alt="Sinergia Agro" class="logo-login">
  <h1>Painel de Qualidade</h1>
  {% if erro %}<p class="mensagem-erro">{{ erro }}</p>{% endif %}
  <label for="email">E-mail</label>
  <input type="email" id="email" name="email" required autofocus>
  <label for="senha">Senha</label>
  <input type="password" id="senha" name="senha" required>
  <label class="opcao-lembrar"><input type="checkbox" name="lembrar" checked> Manter conectado (usar na TV)</label>
  <button type="submit">Entrar</button>
</form>
</body>
</html>
